# The name that appears in the "Actions" tab of your GitHub repository
name: Weather ETL Pipeline

# Controls when the workflow will run
on:
  schedule:
    # Runs automatically every 10 minutes (UTC time)
    # Cron format: minute hour day-of-month month day-of-week
    - cron: "*/10 * * * *"

  # Enables a manual "Run workflow" button in the GitHub UI for on-demand testing
  workflow_dispatch:

# Defines the sequence of tasks (jobs) to run
jobs:
  etl-job:
    # Specifies the Linux operating system to spin up in GitHub's cloud
    runs-on: ubuntu-latest

    # The sequential steps that make up this job
    steps:
      # Step 1: Downloads a copy of your repository code onto the virtual machine
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Installs Python 3.11 on the virtual machine and caches for further runs
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Step 3: Upgrades pip and installs required packages (pandas, requests, openpyxl, etc.)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Runs your main Python script and passes the API key securely from GitHub Secrets
      - name: Execute Pipeline
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: python main.py
